name: TEFAS data refresh

# TEFAS's own prices only change once a day (typically evening, after
# markets close), not intraday. So instead of every app visitor triggering
# a live TEFAS call, this fetches the day's data once, well after it has
# landed, and commits it - the app just reads these files afterwards.
# 09:30 Turkey time (UTC+3, no DST) = 06:30 UTC. Transient TEFAS errors are
# retried inside scripts/refresh_data.py, not by extra scheduled runs.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/refresh_data.py
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh TEFAS data snapshot"
            git push
          fi
