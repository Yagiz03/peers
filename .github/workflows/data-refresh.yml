name: TEFAS data refresh

# TEFAS's own prices only change once a day (typically evening, after
# markets close), not intraday. So instead of every app visitor triggering
# a live TEFAS call, this fetches the day's data a few times during the
# window it usually lands in and commits it - the app just reads these
# files afterwards. 08:00-10:00 Turkey time (UTC+3, no DST) = 05:00-07:00
# UTC, every 30 minutes.
on:
  schedule:
    - cron: "0,30 5-7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/refresh_data.py
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh TEFAS data snapshot"
            git push
          fi
